name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools (quickjs-ng source build fallback)
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile all source files
        run: |
          python3 -m py_compile \
            udb_sonarr.py \
            Clients/SonarrClient.py \
            Clients/SeriesMatcher.py \
            Clients/KissKhClient.py \
            Clients/AsiaflixClient.py \
            Clients/AnimePaheClient.py \
            Utils/YtDlpDownloader.py \
            Utils/HLSDownloader.py \
            Utils/BaseDownloader.py \
            Utils/commons.py

      - name: Import all clients
        run: |
          python3 -c "
          import sys; sys.path.insert(0, '.')
          from Clients.SonarrClient import SonarrClient
          from Clients.SeriesMatcher import SeriesMatcher
          from Clients.KissKhClient import KissKhClient
          from Clients.AsiaflixClient import AsiaflixClient
          from Utils.YtDlpDownloader import YtDlpDownloader
          print('All imports OK')
          "

      - name: CLI smoke test
        run: |
          python3 udb_sonarr.py --version
          python3 udb_sonarr.py --help > /dev/null && echo "help OK"

      - name: Config template parses
        run: |
          python3 -c "
          import yaml
          cfg = yaml.safe_load(open('config_sonarr.yaml.example'))
          assert 'SonarrConfig' in cfg
          print('Config template OK:', list(cfg.keys()))
          "

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{sha}}-,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
